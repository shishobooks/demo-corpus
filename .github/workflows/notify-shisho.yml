name: Notify Shisho

on:
  push:
    branches:
      - master
    # Documentation-only pushes never change the image, so skip the deploy.
    paths-ignore:
      - "*.md"

permissions: {}

jobs:
  dispatch:
    name: Trigger demo deploy
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to shishobooks/shisho
        env:
          # Fine-grained token with Contents read and write on shishobooks/shisho.
          GH_TOKEN: ${{ secrets.SHISHO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SHISHO_DISPATCH_TOKEN is not set in this repository's secrets"
            exit 1
          fi
          gh api repos/shishobooks/shisho/dispatches -f event_type=demo-corpus-updated
